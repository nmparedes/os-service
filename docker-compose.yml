services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - os_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  os-service:
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      SERVICE_NAME: ${SERVICE_NAME:-os-service}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-fiap-tech-challenge-auth-function}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fiap-tech-challenge-api}
      JWT_REQUIRED_CUSTOMER_STATUS: ${JWT_REQUIRED_CUSTOMER_STATUS:-ACTIVE}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
      CUSTOMER_SERVICE_BASE_URL: ${CUSTOMER_SERVICE_BASE_URL:?set CUSTOMER_SERVICE_BASE_URL}
      WORKSHOP_SERVICE_BASE_URL: ${WORKSHOP_SERVICE_BASE_URL:?set WORKSHOP_SERVICE_BASE_URL}
      DB_SSL: "false"
      MESSAGING_ENABLED: ${MESSAGING_ENABLED:-false}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      CONSUMED_MESSAGE_LEASE_MS: ${CONSUMED_MESSAGE_LEASE_MS:-300000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    ports:
      - "${PORT:-3000}:3000"
    command: sh -c "npm run migration:run:prod && node dist/main.js"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  os_mysql_data:
